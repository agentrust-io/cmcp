name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test wheel and sdist
        shell: bash
        run: |
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "${{ github.event_name }}" == "release" ]] && [[ "${{ github.event.release.tag_name }}" != "v$expected_version" ]]; then
            echo "release tag ${{ github.event.release.tag_name }} does not match package version $expected_version" >&2
            exit 1
          fi
          index=0
          for artifact in dist/*.whl dist/*.tar.gz; do
            index=$((index + 1))
            venv="$RUNNER_TEMP/cmcp-dist-$index"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check "$artifact"
            (
              cd "$RUNNER_TEMP"
              "$venv/bin/python" "$GITHUB_WORKSPACE/scripts/verify_python_distribution.py" \
                --expected-version "$expected_version" \
                --forbidden-source-root "$GITHUB_WORKSPACE/src"
              "$venv/bin/cmcp" --help >/dev/null
            )
          done
          test "$index" -eq 2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing, no API tokens
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  governance-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and AGT
        run: python -m pip install --upgrade pip && pip install -e "." "agent-governance-toolkit>=4.1" "agent-governance-toolkit-core>=4.1"

      - name: Generate evidence file
        run: python scripts/gen_agt_evidence.py

      - name: AGT governance verify (strict)
        run: agt verify --evidence agt-evidence.json

      - name: Save attestation JSON
        run: agt --json verify --evidence agt-evidence.json > agt-attestation.json

      - name: Attach evidence to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} agt-evidence.json agt-attestation.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
