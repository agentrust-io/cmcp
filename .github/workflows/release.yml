name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test wheel and sdist
        shell: bash
        env:
          # Never interpolate a tag name into the shell: ${{ }} expands before
          # bash parses the line, so the tag is code rather than a value.
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$EVENT_NAME" == "release" ]] && [[ "$RELEASE_TAG" != "v$expected_version" ]]; then
            echo "release tag $RELEASE_TAG does not match package version $expected_version" >&2
            exit 1
          fi
          index=0
          for artifact in dist/*.whl dist/*.tar.gz; do
            index=$((index + 1))
            venv="$RUNNER_TEMP/cmcp-dist-$index"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check "$artifact"
            (
              cd "$RUNNER_TEMP"
              "$venv/bin/python" "$GITHUB_WORKSPACE/scripts/verify_python_distribution.py" \
                --expected-version "$expected_version" \
                --forbidden-source-root "$GITHUB_WORKSPACE/src"
              "$venv/bin/cmcp" --help >/dev/null
            )
          done
          test "$index" -eq 2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing, no API tokens
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  governance-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install AGT as isolated release tooling
        run: |
          python -m venv .agt-venv
          .agt-venv/bin/python -m pip install --upgrade pip "agent-governance-toolkit>=4.1"
          .agt-venv/bin/python -m pip install --no-deps -e .

      - name: Generate evidence file
        run: .agt-venv/bin/python scripts/gen_agt_evidence.py

      - name: Verify AGT runtime evidence (isolated)
        run: |
          set +e
          output=$(.agt-venv/bin/agt verify --evidence agt-evidence.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq "Runtime Evidence: 6/6 checks passed"
          test "$status" -eq 0 || test "$status" -eq 1

      - name: Save attestation JSON
        run: |
          set +e
          .agt-venv/bin/agt --json verify --evidence agt-evidence.json > agt-attestation.json
          status=$?
          set -e
          python -m json.tool agt-attestation.json > /dev/null
          test "$status" -eq 0 || test "$status" -eq 1

      - name: Attach evidence to release
        if: github.event_name == 'release'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: gh release upload "$REF_NAME" agt-evidence.json agt-attestation.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
