version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # Group minor and patch updates into one weekly PR.
    # Major Python updates remain ignored by the existing policy.
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # One PR per week for minor and patch updates. Majors still arrive
    # one at a time so a breaking change is reviewed on its own.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Dockerfile base images are pinned by digest; this keeps the digest current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Digest refreshes and 3.11 patch releases only. Moving the image to a new
    # Python minor is a deliberate change with its own PR and test run.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
